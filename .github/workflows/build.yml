name: Build APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish/Update as GitHub Release asset'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x scripts/setup-keystore.sh
          ./scripts/setup-keystore.sh

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Package & Verify APKs
        id: package
        run: |
          set -euo pipefail

          version_name=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)
          version_code=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -1)

          mkdir -p dist

          release_apk="app/build/outputs/apk/release/app-release.apk"
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$release_apk" ]; then
            echo "Error: Release APK not found at $release_apk" >&2
            exit 1
          fi

          if [ ! -f "$debug_apk" ]; then
            echo "Error: Debug APK not found at $debug_apk" >&2
            exit 1
          fi

          packaged_release="dist/kinetica-v${version_name}-release.apk"
          packaged_debug="dist/kinetica-v${version_name}-debug.apk"

          cp "$release_apk" "$packaged_release"
          cp "$debug_apk" "$packaged_debug"

          echo "=== Verifying Release APK Signature ==="
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$packaged_release"

          echo "=== Verifying Debug APK Signature ==="
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$packaged_debug"

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "release_apk=$packaged_release" >> "$GITHUB_OUTPUT"
          echo "debug_apk=$packaged_debug" >> "$GITHUB_OUTPUT"

          ls -lh dist/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinetica-apks
          path: dist/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version_name }}
          CODE: ${{ steps.package.outputs.version_code }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_name="$GITHUB_REF_NAME"
            release_title="Kinetica $VERSION"
            prerelease_flag=""
          else
            tag_name="v${VERSION}-nintype"
            release_title="Kinetica v${VERSION} with Nintype Engine"
            prerelease_flag="--prerelease"
          fi

          notes_file="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          notes="Kinetica Keyboard with Nintype Multi-Finger Swipe Decoding Engine integrated."
          if [ -f "$notes_file" ]; then
            notes=$(cat "$notes_file")
          fi

          echo "Publishing to GitHub Release ($tag_name)..."
          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Release $tag_name exists, uploading new APK assets..."
            gh release upload "$tag_name" dist/*.apk --clobber || true
          else
            echo "Creating release $tag_name..."
            gh release create "$tag_name" dist/*.apk \
              --title "$release_title" \
              --notes "$notes" \
              $prerelease_flag || {
                echo "Release create failed or already exists, attempting upload..."
                gh release upload "$tag_name" dist/*.apk --clobber || true
              }
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.properties keystore/sideload.keystore keystore/release.keystore
